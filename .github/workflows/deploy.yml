name: deploy

# Deploys to the production VM only after the enterprise gate succeeds on main.
# Repository branch protection remains an independently required control.
#
# The VM pins the deploy SSH key to a forced command (/usr/local/bin/maacc-deploy.sh),
# so this job only needs to open an SSH connection to trigger a deploy — the key
# cannot be used for anything else. Requires these repository secrets:
#   DEPLOY_SSH_KEY    - private key whose public half is in the VM authorized_keys
#   DEPLOY_HOST       - VM host/IP
#   DEPLOY_USER       - VM ssh user
#   DEPLOY_KNOWN_HOSTS- pinned host key for the production VM

on:
  workflow_run:
    workflows: [enterprise-gate]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production VM
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Deploy over SSH and verify
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_SSH_KEY:-}" ] || [ -z "${DEPLOY_HOST:-}" ] || [ -z "${DEPLOY_USER:-}" ] || [ -z "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            echo "::error title=Deployment configuration missing::DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_USER and DEPLOY_KNOWN_HOSTS are all required."
            exit 1
          fi

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          release_sha="${{ github.event.workflow_run.head_sha }}"
          echo "Deploying ${release_sha::7} to ${DEPLOY_HOST} ..."
          # The forced command on the server runs the deploy; the trailing word
          # is ignored. SSH blocks until the deploy finishes and streams its log,
          # and a non-zero exit here fails the job.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o ConnectTimeout=20 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" deploy

          echo "Verifying https://maacc.app/up ..."
          for i in $(seq 1 6); do
            code="$(curl -fsS -o /dev/null -w '%{http_code}' https://maacc.app/up 2>/dev/null || echo 000)"
            if [ "$code" = "200" ]; then
              echo "Health check OK (HTTP $code)"
              exit 0
            fi
            echo "attempt $i: HTTP $code — retrying in 5s"
            sleep 5
          done
          echo "::error title=Health check failed::https://maacc.app/up did not return 200 after deploy"
          exit 1
