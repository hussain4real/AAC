name: deploy

# Deploys to the production VM whenever main advances (i.e. a PR merges).
# main is branch-protected and requires the lint + tests checks to pass before
# merge, so anything that reaches main has already been validated.
#
# The VM pins the deploy SSH key to a forced command (/usr/local/bin/maac-deploy.sh),
# so this job only needs to open an SSH connection to trigger a deploy — the key
# cannot be used for anything else. Requires these repository secrets:
#   DEPLOY_SSH_KEY    - private key whose public half is in the VM authorized_keys
#   DEPLOY_HOST       - VM host/IP
#   DEPLOY_USER       - VM ssh user
#   DEPLOY_KNOWN_HOSTS- (optional) pinned host key; falls back to ssh-keyscan
# Without the secrets the job no-ops, so merging this file is safe on its own.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production VM
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Deploy over SSH and verify
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_SSH_KEY:-}" ] || [ -z "${DEPLOY_HOST:-}" ] || [ -z "${DEPLOY_USER:-}" ]; then
            echo "::warning title=Deploy skipped::Add the DEPLOY_SSH_KEY, DEPLOY_HOST and DEPLOY_USER repository secrets to enable deployment."
            exit 0
          fi

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null || true
          fi
          chmod 600 ~/.ssh/known_hosts

          echo "Deploying ${GITHUB_SHA::7} to ${DEPLOY_HOST} ..."
          # The forced command on the server runs the deploy; the trailing word
          # is ignored. SSH blocks until the deploy finishes and streams its log,
          # and a non-zero exit here fails the job.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o ConnectTimeout=20 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" deploy

          echo "Verifying https://maac.techstus.com/up ..."
          for i in $(seq 1 6); do
            code="$(curl -fsS -o /dev/null -w '%{http_code}' https://maac.techstus.com/up 2>/dev/null || echo 000)"
            if [ "$code" = "200" ]; then
              echo "Health check OK (HTTP $code)"
              exit 0
            fi
            echo "attempt $i: HTTP $code — retrying in 5s"
            sleep 5
          done
          echo "::error title=Health check failed::https://maac.techstus.com/up did not return 200 after deploy"
          exit 1
