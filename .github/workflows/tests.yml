name: enterprise-gate

on:
  push:
    branches:
      - dev
      - main
      - master
      - workos
  pull_request:
    branches:
      - dev
      - main
      - master
      - workos

permissions:
  contents: read

jobs:
  enterprise-gate:
    name: ci (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies from lock file
        run: npm ci

      - name: Install PHP dependencies from lock file
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Restore PHP-specific TIA state
        id: tia-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pest/tia
          key: pest-tia-${{ runner.os }}-${{ runner.arch }}-php-${{ matrix.php }}-${{ hashFiles('composer.lock', 'package-lock.json', 'phpunit.xml') }}-${{ github.sha }}
          restore-keys: |
            pest-tia-${{ runner.os }}-${{ runner.arch }}-php-${{ matrix.php }}-${{ hashFiles('composer.lock', 'package-lock.json', 'phpunit.xml') }}-
            pest-tia-${{ runner.os }}-${{ runner.arch }}-php-${{ matrix.php }}-

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Generate Wayfinder definitions
        run: php artisan wayfinder:generate --with-form --no-interaction

      - name: Build production assets
        run: npm run build

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Run non-mutating aggregate engineering gate
        run: composer ci:check:static

      - name: Enforce complete PHP line coverage
        run: ./vendor/bin/pest --coverage --min=100 --compact --tia

      - name: Verify checks did not mutate tracked files
        run: git diff --exit-code

      - name: Save PHP-specific TIA state
        if: steps.tia-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pest/tia
          key: ${{ steps.tia-cache.outputs.cache-primary-key }}
