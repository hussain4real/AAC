name: linter

on:
  push:
    branches:
      - dev
      - main
      - master
      - workos
  pull_request:
    branches:
      - dev
      - main
      - master
      - workos

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies from lock file
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Install Node dependencies from lock file
        run: npm ci

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Generate Wayfinder definitions
        run: php artisan wayfinder:generate --no-interaction

      - name: Check PHP formatting
        run: composer lint:check

      - name: Check frontend formatting
        run: npm run format:check

      - name: Check frontend lint
        run: npm run lint:check

      - name: Verify checks did not mutate tracked files
        run: git diff --exit-code
